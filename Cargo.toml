[package]
name = "agent-receipt"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Claude Code and Codex Stop hook that blocks hallucinated completion: \"tests pass\" / \"committed\" claims need a passing command in the transcript"
license = "MIT"
repository = "https://github.com/majiayu000/receipt"
homepage = "https://github.com/majiayu000/receipt"
readme = "README.md"
keywords = ["claude-code", "codex", "ai-agents", "hooks", "verification"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["eval/", "docs/", ".github/"]

[lib]
name = "receipt"

[[bin]]
name = "receipt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
